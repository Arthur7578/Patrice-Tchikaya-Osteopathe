name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Couverture + tests unitaires/composants ; échoue si les seuils de src/lib/** ne sont plus tenus.
      - run: npm run test:coverage
      # Sans NOTION_TOKEN, le build utilise fallback.ts (voir CLAUDE.md) : suffisant pour l'e2e.
      - run: npm run build
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapports-tests
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
