name: Contrôle du site en production

# Chaque matin, ou à la demande : seo:smoke sur https://osteopathe-tchikaya.lu, donc sur le contenu Notion réel
# (le reste de la CI utilise le contenu de secours). Détecte par exemple un <h1> en double, une canonical fausse,
# des boutons de RDV qui ne pointent plus vers Url_Booking ou une page motif disparue après une modification dans Notion.
# Vérifie aussi que le lien de RDV répond chez le prestataire (SMOKE_CHECK_BOOKING) : un 404 ou 410 fait échouer le contrôle,
# un blocage anti-robots ou une panne donne un avertissement. Signale enfin, en avertissement, les textes d'attente
# (« [À COMPLÉTER …] ») encore visibles sur une page du sitemap.
# Secret recommandé : NOTION_TOKEN (intégration en lecture seule, Settings > Secrets and variables > Actions).
# Avec lui, seo:smoke compare le site au contenu Notion et notion:check signale les problèmes de contenu ;
# sans lui, la comparaison se fait avec fallback.ts et peut signaler des écarts qui n'en sont pas.
#
# Notification : seulement en cas de problème. Un échec ouvre une issue « Production : contrôle quotidien en échec »
# assignée au propriétaire du dépôt (e-mail et application GitHub), avec les contrôles en échec ; chaque nouvel échec
# y ajoute un commentaire. Au premier contrôle de nouveau vert, l'issue est fermée avec un commentaire. Les
# avertissements (textes d'attente, lien de RDV qui répond autre chose que 404/410) ne notifient pas.
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # ouvrir, commenter et fermer l'issue d'alerte

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret NOTION_TOKEN absent
        if: env.NOTION_TOKEN == ''
        run: |
          echo "::warning::Secret NOTION_TOKEN absent : comparaison avec le contenu de secours (fallback.ts), notion:check non lancé."
      - name: Diagnostic du contenu Notion (notion:check)
        if: env.NOTION_TOKEN != ''
        run: |
          printf 'NOTION_TOKEN=%s\n' "$NOTION_TOKEN" > .env.local
          npm run notion:check
      - name: Contrôles SEO et lien de rendez-vous (seo:smoke)
        run: |
          set -o pipefail
          npm run seo:smoke -- https://osteopathe-tchikaya.lu 2>&1 | tee smoke.log
        env:
          SMOKE_CHECK_BOOKING: "1"
      - name: Alerte (issue assignée au propriétaire du dépôt)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create production-smoke --color B60205 --description "Contrôle quotidien de la production" --force
          failed="$(grep '^✗' smoke.log 2>/dev/null | head -30 || true)"
          [ -n "$failed" ] || failed="(échec avant les contrôles SEO : voir le journal, par exemple notion:check ou l'installation)"
          body="$(printf 'Le contrôle quotidien de %s a échoué le %s.\n\n**Contrôles en échec :**\n```\n%s\n```\n\nJournal complet : %s\n\nCette issue se fermera toute seule au prochain contrôle réussi.' "https://osteopathe-tchikaya.lu" "$(date -u '+%d/%m/%Y')" "$failed" "$RUN_URL")"
          open="$(gh issue list --label production-smoke --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "Production : contrôle quotidien en échec" --label production-smoke \
              --assignee "${{ github.repository_owner }}" --body "$body"
          fi
      - name: Fin d'alerte (contrôle de nouveau vert)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label production-smoke --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Contrôle de nouveau réussi le $(date -u '+%d/%m/%Y') : alerte levée."
          done
