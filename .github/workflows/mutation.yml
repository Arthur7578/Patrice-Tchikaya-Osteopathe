name: Mutation testing (Stryker)

# Non bloquant. Chaque nuit, ou à la demande (onglet Actions > Run workflow) : tous les groupes de
# stryker/groups.json. Sur une PR qui modifie cet outillage : un seul petit groupe, pour vérifier le workflow.
# Un mutant « survivant » = une modification du code qu'aucun test ne remarque. Résumé et survivants dans le
# résumé du job ; rapport HTML complet en artefact.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mutation.yml
      - stryker/**
      - scripts/stryker.ts

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groups:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.groups.outputs.names }}
    steps:
      - uses: actions/checkout@v5
      - id: groups
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'names=["google"]' >> "$GITHUB_OUTPUT"
          else
            echo "names=$(jq -c '[.[].name]' stryker/groups.json)" >> "$GITHUB_OUTPUT"
          fi

  stryker:
    needs: groups
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.groups.outputs.names) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Mode incrémental : seuls les mutants dont le CODE a changé sont rejoués. Avec le runner « command »,
      # Stryker ne voit pas les modifications de tests (vérifié : 192/192 résultats réutilisés après avoir
      # modifié un test). La clé contient donc le hash des tests : test modifié = cache manqué = passage complet.
      - uses: actions/cache@v5
        with:
          path: reports/incremental/${{ matrix.group }}.json
          key: stryker-${{ matrix.group }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'src/test/**', 'vitest.setup.ts', 'vitest.config.mts', 'stryker/**') }}-${{ github.run_id }}
          restore-keys: stryker-${{ matrix.group }}-${{ hashFiles('src/**/*.test.ts', 'src/**/*.test.tsx', 'src/test/**', 'vitest.setup.ts', 'vitest.config.mts', 'stryker/**') }}-
      - run: npm run test:mutation -- ${{ matrix.group }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-${{ matrix.group }}
          path: reports/mutation/${{ matrix.group }}
          if-no-files-found: ignore
          retention-days: 14
